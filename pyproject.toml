[project]
name = "lenscraft"
version = "0.1.0"
description = "Agentic gravitational lensing simulation pipeline (LensCard -> lensjsonl -> ML -> uncertainty-driven resimulation)"
authors = [
    { name = "amanibobo", email = "amanibobo1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.12",
    "astropy>=6.0",
    "lenstronomy>=1.12",
    "pydantic-ai>=2.41.0",
    "modal>=1.5.5",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
# Phase 3: ML tier (installed only inside the Modal image; the laptop never needs torch)
ml = ["torch>=2.2", "torchvision>=0.17", "scikit-learn>=1.4"]
# Phase 5 (stretch): cross-backend validation
pyautolens = ["autolens"]

[project.scripts]
lenscraft = "lenscraft.cli:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs the real Lenstronomy engine (slower; skipped automatically if lenstronomy is missing)",
]

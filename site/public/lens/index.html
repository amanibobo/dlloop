<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gravitational lensing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#232323; --fg:#ffffff;
    --muted:rgba(255,255,255,.58); --line:rgba(255,255,255,.34);
    --face:rgba(255,255,255,.035); --wall1:rgba(255,255,255,.12); --wall2:rgba(255,255,255,.015);
    color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#232323; --fg:#ffffff;
    --muted:rgba(255,255,255,.58); --line:rgba(255,255,255,.34);
    --face:rgba(255,255,255,.035); --wall1:rgba(255,255,255,.12); --wall2:rgba(255,255,255,.015);
    color-scheme: dark; }
}
:root[data-theme="dark"]{ --bg:#232323; --fg:#ffffff;
    --muted:rgba(255,255,255,.58); --line:rgba(255,255,255,.34);
    --face:rgba(255,255,255,.035); --wall1:rgba(255,255,255,.12); --wall2:rgba(255,255,255,.015);
    color-scheme: dark; }
:root[data-theme="light"]{ --bg:#ffffff; --fg:#3a3a3a;
    --muted:rgba(58,58,58,.62); --line:rgba(58,58,58,.4);
    --face:rgba(58,58,58,.035); --wall1:rgba(58,58,58,.1); --wall2:rgba(58,58,58,.015);
    color-scheme: light; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Newsreader",Georgia,"Times New Roman",serif;
  -webkit-font-smoothing:antialiased}

html,body{height:100%}
body{overflow:hidden}
.stage{position:relative;height:100%;overflow:hidden}
.svgwrap{position:absolute;inset:clamp(8px,3vw,40px)}
svg#scene-svg{width:100%;height:100%;display:block}
.pop{transform-box:fill-box;transform-origin:center}


.invert{display:none;position:absolute;top:16px;right:clamp(16px,3vw,40px);
  font:inherit;font-style:italic;font-size:1rem;color:var(--fg);background:transparent;
  border:1px solid var(--line);border-radius:999px;padding:.35rem .9rem;cursor:pointer}
.invert:hover{border-color:var(--fg)}
.invert:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

</style>
</head>
<body>
<div class="stage">
    <div class="svgwrap">
      <svg id="scene-svg" viewBox="0 0 2296 1607" preserveAspectRatio="xMidYMid meet" role="img"
           aria-label="Diagram of gravitational lensing: light from a distant galaxy bends around a galaxy cluster toward Earth">
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <radialGradient id="halo">
            <stop offset="0" style="stop-color:var(--fg);stop-opacity:.45"/>
            <stop offset="1" style="stop-color:var(--fg);stop-opacity:0"/>
          </radialGradient>
          <radialGradient id="galGrad">
            <stop offset="0" style="stop-color:var(--fg);stop-opacity:1"/>
            <stop offset=".45" style="stop-color:var(--fg);stop-opacity:.35"/>
            <stop offset="1" style="stop-color:var(--fg);stop-opacity:0"/>
          </radialGradient>
          <radialGradient id="atmo">
            <stop offset=".62" style="stop-color:#7fb4ff;stop-opacity:.55"/>
            <stop offset=".75" style="stop-color:#7fb4ff;stop-opacity:.18"/>
            <stop offset="1" style="stop-color:#7fb4ff;stop-opacity:0"/>
          </radialGradient>
          <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" style="stop-color:var(--fg);stop-opacity:.10"/>
            <stop offset="1" style="stop-color:var(--fg);stop-opacity:.01"/>
          </linearGradient>
                  </defs>

        <g id="scene">
          <!-- box -->
          <g id="faces" opacity="0">
            <polygon points="515,57 2180,833 2178,1278 515,475" fill="url(#wallGrad)"/>
            <polygon points="95,718 515,475 2178,1278 1722,1540" fill="var(--face)"/>
            <polygon points="95,292 515,57 515,475 95,718" fill="var(--face)"/>
          </g>
          <g fill="none" stroke="var(--line)" stroke-width="3" stroke-linejoin="round">
            <path class="edge" d="M95,292 L515,57 L515,475"/>
            <path class="edge" d="M95,292 L95,718 L515,475"/>
            <path class="edge" d="M515,57 L2180,833 L2178,1278 L1722,1540 L95,718"/>
          </g>

          <!-- lens-plane ripples -->
          <g id="rings" transform="translate(1205 840) matrix(1 -0.56 0 1.01 0 0)" fill="none" stroke="var(--fg)" stroke-width="1.5">
            <circle class="ring pop" r="120" vector-effect="non-scaling-stroke" opacity="0"/>
            <circle class="ring pop" r="200" vector-effect="non-scaling-stroke" opacity="0"/>
            <circle class="ring pop" r="285" vector-effect="non-scaling-stroke" opacity="0"/>
          </g>

          <!-- cluster (generated) -->
          <g id="cluster" filter="url(#glow)"></g>

          <!-- rays -->
          <g fill="none" stroke="var(--fg)" stroke-width="3.5" stroke-linecap="round">
            <path class="ray" id="inTop" d="M300,375 L1318,645"/>
            <path class="ray" id="inBot" d="M300,375 L975,918"/>
            <path class="ray" id="mid" d="M300,375 L1950,1165"/>
            <path class="ray" id="strTop" d="M1318,645 L1770,765"/>
            <path class="ray" id="strBot" d="M975,918 L1295,1175"/>
            <path class="ray" id="bentTop" d="M1318,645 L1960,1135"/>
            <path class="ray" id="bentBot" d="M975,918 L1880,1185"/>
          </g>
          <g fill="none" stroke="var(--fg)" stroke-width="3" stroke-dasharray="26 22" stroke-linecap="round">
            <path class="dash" d="M1318,645 L1770,765" opacity="0"/>
            <path class="dash" d="M975,918 L1295,1175" opacity="0"/>
          </g>
          <g id="arrows" fill="var(--fg)"></g>

          <!-- photon routes (invisible) -->
          <g fill="none" stroke="none">
            <path id="rStrTop" d="M300,375 L1770,765"/>
            <path id="rStrBot" d="M300,375 L1295,1175"/>
            <path id="rMid" d="M300,375 L1950,1165"/>
            <path id="rBentTop" d="M300,375 L1318,645 L1960,1135"/>
            <path id="rBentBot" d="M300,375 L975,918 L1880,1185"/>
          </g>
          <g id="photons" filter="url(#glow)" fill="var(--fg)"></g>

          <!-- source galaxy -->
          <g transform="translate(300 375)">
            <g id="source" class="pop" opacity="0">
              <circle r="150" fill="url(#halo)" opacity=".6"/>
              <g transform="rotate(8) scale(.42 1)">
                <circle r="58" fill="url(#galGrad)"/>
                <g fill="none" stroke="var(--fg)" stroke-width="2.6" stroke-linecap="round" opacity=".85">
                  <path d="M0,0 C14,-4 24,-16 22,-30 S6,-52 -14,-47"/>
                  <path d="M0,0 C-14,4 -24,16 -22,30 S-6,52 14,47"/>
                  <path d="M4,-8 C20,-6 35,8 31,25"/>
                  <path d="M-4,8 C-20,6 -35,-8 -31,-25"/>
                </g>
                <circle r="7" fill="var(--fg)"/>
              </g>
            </g>
          </g>

          <!-- earth -->
          <g transform="translate(2060 1218)">
            <g id="earth" class="pop" opacity="0">
              <circle r="118" fill="url(#atmo)"/>

<script src="./anime.min.js"></script>
<script>
(function(){
  const NS = 'http://www.w3.org/2000/svg';
  const $ = s => document.querySelector(s);
  const make = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };


  /* ---------- invert toggle ---------- */
  const root = document.documentElement, btn = $('#invert');
  const setTheme = t => { root.setAttribute('data-theme', t); btn.setAttribute('aria-pressed', t === 'light'); };
  setTheme('light');
  btn.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    setTheme(next);
    try { localStorage.setItem('lens-theme', next); } catch(e){}
  });

  /* ---------- seeded random ---------- */
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  const rnd = mulberry32(11);
  const gauss = () => { let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };

  function galaxy(parent, x, y, rx, ry, rot, o){
    const g = make('g', {transform:`translate(${x} ${y}) rotate(${rot})`, opacity:o}, parent);
    make('ellipse', {class:'pop cdot', rx, ry, fill:'var(--fg)'}, g);
  }

  /* cluster in 3D scene */
  const cluster = $('#cluster');
  [[1225,878,22,17,20,1],[1135,972,19,14,-30,1],[1250,785,12,10,10,.95],[1212,815,12,9,40,.95],
   [1117,755,11,8,0,.9],[1300,660,8,5,30,.8],[958,652,10,5,-25,.8]].forEach(a=>galaxy(cluster,...a));
  for (let i=0;i<58;i++){
    const x = 1205 + gauss()*140, y = 840 + gauss()*120;
    const rx = 2.5 + Math.pow(rnd(),3)*8;
    galaxy(cluster, x.toFixed(1), y.toFixed(1), rx.toFixed(1), (rx*(.45+rnd()*.55)).toFixed(1), Math.round(rnd()*180), (.45+rnd()*.55).toFixed(2));
  }

  /* arrowheads */
  const arrows = $('#arrows');
  function arrow(id, x1,y1,x2,y2,size=34){
    const a = Math.atan2(y2-y1, x2-x1), c=Math.cos(a), s=Math.sin(a);
    const bx = x2 - c*size, by = y2 - s*size, w = size*.5;
    const ix = x2 - c*size*.6, iy = y2 - s*size*.6;
    const pts = [[x2,y2],[bx - s*w, by + c*w],[ix,iy],[bx + s*w, by - c*w]].map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
    return make('polygon', {id, points:pts, opacity:0}, arrows);
  }
  arrow('arStrTop', 1318,645,1770,765);
  arrow('arStrBot', 975,918,1295,1175);
  arrow('arMid', 300,375,1950,1165);
  arrow('arBentTop', 1318,645,1960,1135);
  arrow('arBentBot', 975,918,1880,1185);

  /* photons */
  const photonG = $('#photons');
  const routes = [
    {p:'#rStrTop', on:3100, off:5100},
    {p:'#rStrBot', on:3100, off:5100},
    {p:'#rMid',    on:3000, off:9600},
    {p:'#rBentTop',on:6100, off:9600},
    {p:'#rBentBot',on:6100, off:9600}
  ].map(r => {
    const path = $(r.p), len = path.getTotalLength();
    const dots = [0,1,2].map(() => make('circle', {r:5.5, opacity:0}, photonG));
    return Object.assign(r, {path, len, dots});
  });

  /* ---------- looping timeline ---------- */
  const tl = anime.timeline({autoplay:false, easing:'easeInOutSine'});
  const draw = (t, start, dur, ease='easeInOutQuad', extra={}) =>
    tl.add(Object.assign({targets:t, strokeDashoffset:[anime.setDashoffset, 0], duration:dur, easing:ease}, extra), start);
  const fadeIn = (t, start, dur, to=1) => tl.add({targets:t, opacity:[0,to], duration:dur}, start);

  // box
  draw('.edge', 0, 700, 'easeInOutQuad', {delay: anime.stagger(120)});
  fadeIn('#faces', 300, 700);
  // source galaxy
  tl.add({targets:'#source', opacity:[0,1], scale:[.3,1], duration:700, easing:'easeOutCubic'}, 1000);
  // straight light + Earth
  draw('#inTop', 2000, 600);
  draw('#inBot', 2000, 600);
  draw('#mid', 2000, 1000, 'easeInOutSine');
  draw('#strTop', 2600, 500, 'easeOutQuad');
  draw('#strBot', 2600, 500, 'easeOutQuad');
  tl.add({targets:'#earth', opacity:[0,1], scale:[.5,1], duration:500, easing:'easeOutCubic'}, 2400);
  fadeIn('#arMid', 2950, 150);
  tl.add({targets:['#arStrTop','#arStrBot'],
          opacity:[{value:[0,1],duration:200},{value:1,duration:1700},{value:.45,duration:400}]}, 3100);
  // cluster
  tl.add({targets:'#cluster .cdot', opacity:[0,1], scale:[0,1], duration:500, delay:anime.stagger(10), easing:'easeOutBack'}, 3500);
  tl.add({targets:'.ring', scale:[.25,1], opacity:[{value:[0,.6],duration:350},{value:.18,duration:550}],
          duration:900, delay:anime.stagger(160), easing:'easeOutQuad'}, 3900);
  // bending
  tl.add({targets:['#strTop','#strBot'], opacity:[1,0], duration:400}, 5000);
  fadeIn('.dash', 5000, 400, .5);
  draw('#bentTop', 5300, 800);
  draw('#bentBot', 5350, 800);
  fadeIn(['#arBentTop','#arBentBot'], 6050, 200);
  // hold, then fade out and restart
  tl.add({targets:'#scene', opacity:[1,0], duration:900, easing:'easeInQuad'}, 9600);
  tl.add({targets:'.stage', opacity:[1,1], duration:500}, 10500);

  const TOTAL = tl.duration;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp01 = v => Math.max(0, Math.min(1, v));
  let t0 = null;

  function frame(now){
    if (t0 === null) t0 = now;
    const t = reduce ? 8000 : (now - t0) % TOTAL;
    tl.seek(t);

    // photons travel along whichever paths exist at this point in the loop
    routes.forEach(r => {
      const vis = clamp01((t - r.on)/300) * (r.off === Infinity ? 1 : clamp01((r.off - t)/300));
      r.dots.forEach((d, k) => {
        if (vis <= 0 || reduce){ d.setAttribute('opacity', 0); return; }
        const f = ((now * 0.00028) + k/3) % 1;
        const p = r.path.getPointAtLength(f * r.len);
        d.setAttribute('cx', p.x.toFixed(1));
        d.setAttribute('cy', p.y.toFixed(1));
        d.setAttribute('opacity', (vis * Math.sin(Math.PI * f)).toFixed(3));
      });
    });
    if (!reduce) requestAnimationFrame(frame);
  }
  tl.seek(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
